name: Android APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate project root with verified Gradle repositories
        id: project-root
        shell: bash
        run: |
          set -euo pipefail
          MIRROR="https://maven-central-eu.storage-download.googleapis.com/maven2/"
          PROJECT_ROOT=""
          while IFS= read -r -d '' settings_file; do
            candidate="${settings_file%/settings.gradle.kts}"
            [[ -n "$candidate" ]] || candidate="."
            if [[ -f "$candidate/gradlew" \
               && -f "$candidate/build.gradle.kts" \
               && -f "$candidate/app/build.gradle.kts" \
               && -f "$candidate/Cargo.toml" \
               && -f "$candidate/gradle/wrapper/gradle-wrapper.jar" ]] \
               && grep -Fq "$MIRROR" "$settings_file" \
               && grep -Fq "$MIRROR" "$candidate/build.gradle.kts"; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find . -maxdepth 6 -type f -name 'settings.gradle.kts' \
                    -not -path '*/.gradle/*' -print0)

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::Could not find the updated BasaltProxy Gradle root. The checkout must contain settings.gradle.kts, build.gradle.kts, app/build.gradle.kts, Cargo.toml, gradlew, gradle-wrapper.jar, and the Google Maven Central mirror."
            echo "Gradle settings files found:"
            find . -maxdepth 6 -type f -name 'settings.gradle.kts' -not -path '*/.gradle/*' -print
            exit 1
          fi

          echo "path=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Using Gradle project root: $PROJECT_ROOT"
          echo "--- settings.gradle.kts ---"
          sed -n '1,100p' "$PROJECT_ROOT/settings.gradle.kts"
          echo "--- build.gradle.kts ---"
          sed -n '1,100p' "$PROJECT_ROOT/build.gradle.kts"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already provide Android command-line tools.
      # Avoid android-actions/setup-android@v3 here: it invokes `sdkmanager tools`,
      # but the legacy `tools` SDK package is no longer published by Google.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # Feed license answers from a regular file, not a pipe. sdkmanager
          # may close stdin as soon as it has enough answers; `yes | ...`
          # then receives SIGPIPE and fails under `set -o pipefail`.
          LICENSE_INPUT="$(mktemp)"
          trap 'rm -f "$LICENSE_INPUT"' EXIT
          for _ in {1..100}; do printf 'y\n'; done > "$LICENSE_INPUT"
          "$SDKMANAGER" --licenses < "$LICENSE_INPUT" >/dev/null

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Android 17 / API 37 is currently published as android-37.0
          # (a preview/canary platform package), not android-37.
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          # AGP resolves compileSdk = 37 to the legacy android-37 directory
          # name, while SDK Manager installs this platform as android-37.0.
          # Provide the expected alias without duplicating the platform files.
          PLATFORM_VERSIONED="$ANDROID_HOME/platforms/android-37.0"
          PLATFORM_AGP="$ANDROID_HOME/platforms/android-37"
          if [[ -d "$PLATFORM_VERSIONED" && ! -f "$PLATFORM_AGP/android.jar" ]]; then
            if [[ -e "$PLATFORM_AGP" || -L "$PLATFORM_AGP" ]]; then
              rm -rf "$PLATFORM_AGP"
            fi
            ln -s "android-37.0" "$PLATFORM_AGP"
          fi
          if [[ ! -f "$PLATFORM_AGP/android.jar" ]]; then
            echo "::error::Android 17 platform was not installed at $PLATFORM_VERSIONED"
            ls -la "$ANDROID_HOME/platforms" || true
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native arm64 library
        working-directory: ${{ steps.project-root.outputs.path }}
        run: >-
          cargo ndk -t arm64-v8a --platform 24
          -o app/src/main/jniLibs build --release

      - name: Build native arm32 library
        working-directory: ${{ steps.project-root.outputs.path }}
        run: >-
          cargo ndk -t armeabi-v7a --platform 21
          -o app/src/main/jniLibs build --release

      # Cache Gradle distributions and resolved dependencies between CI runs.
      # This reduces Maven Central traffic and avoids unnecessary re-downloads.
      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Release APKs
        working-directory: ${{ steps.project-root.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          # Git may check out gradlew without its executable bit (mode 100644).
          # Normalize permissions on the runner before invoking the wrapper.
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basalt-proxy-release-apks
          path: ${{ steps.project-root.outputs.path }}/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14
