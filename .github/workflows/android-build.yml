name: Android APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already provide Android command-line tools.
      # Avoid android-actions/setup-android@v3 here: it invokes `sdkmanager tools`,
      # but the legacy `tools` SDK package is no longer published by Google.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # Feed license answers from a regular file, not a pipe. sdkmanager
          # may close stdin as soon as it has enough answers; `yes | ...`
          # then receives SIGPIPE and fails under `set -o pipefail`.
          LICENSE_INPUT="$(mktemp)"
          trap 'rm -f "$LICENSE_INPUT"' EXIT
          for _ in {1..100}; do printf 'y\n'; done > "$LICENSE_INPUT"
          "$SDKMANAGER" --licenses < "$LICENSE_INPUT" >/dev/null

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native arm64 library
        run: >-
          cargo ndk -t arm64-v8a --platform 24
          -o app/src/main/jniLibs build --release

      - name: Build native arm32 library
        run: >-
          cargo ndk -t armeabi-v7a --platform 21
          -o app/src/main/jniLibs build --release

      - name: Build Release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basalt-proxy-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14
